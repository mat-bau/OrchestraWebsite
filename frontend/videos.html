<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
	<meta name="description" content="Official website of the Louvain-la-Neuve based Orchestrakot.">
	<link rel="shortcut icon" type="image/x-icon" href="../images/support_graphique/Logo_Orchestrakot_SQUARE.png?v=2"/>
	<title>Vidéos - OrchestraKot</title>
	<link href="http://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,900" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="site-content">
		<header class="site-header">
			<div class="container">
				<a href="index.html" id="branding">
					<img src="../images/support_graphique/Logo_Orchestrakot_SQUARE.png" alt="OrchestraKot" class="head_logo">
				</a>
				<nav class="main-navigation">
					<button type="button" class="toggle-menu"><i class="fa fa-bars"></i></button>
					<ul class="menu">
						<li class="menu-item"><a href="index.html">Home</a></li>
						<li class="menu-item"><a href="about.html">About</a></li>
						<li class="menu-item"><a href="gallery.html">Galerie</a></li>
						<li class="menu-item current-menu-item"><a href="videos.html">Vidéos</a></li>
						<li class="menu-item"><a href="offer.html">Contact</a></li>
					</ul>
				</nav>
				<div class="mobile-menu"></div>
			</div>
		</header>

		<main class="main-content">
			<div class="fullwidth-block inner-content">
				<div class="container">

					<div class="videos-page">
						<div class="videos-header">
							<h1 class="videos-page-title">Vidéos</h1>
							<a id="youtube-channel-link"
							   href="https://www.youtube.com/channel/UCNfleJHSeg1hwH2XoNd5JuQ"
							   target="_blank" rel="noopener"
							   class="youtube-channel-btn">
								<i class="fa-brands fa-youtube"></i> Notre chaîne YouTube
							</a>
						</div>

						<!-- Timeline populated by videos.js -->
						<div id="videos-timeline"></div>
					</div>

				</div>
			</div>
		</main>

		<footer class="site-footer">
			<div class="container">
				<img src="../images/support_graphique/Logo_Orchestrakot_Rectangle.png" alt="OrchestraKot" class="foot_logo">
				<address>
					<p>1 Rampes des Ardennais, Louvain-la-Neuve, Belgique <br>
					<a href="tel:+32497304104">(+32) 497 30 41 04</a> <br>
					<a href="mailto:orchestrakot.ucl@gmail.com">orchestrakot.ucl@gmail.com</a></p>
				</address>
				<div class="social-links">
					<a href="https://www.facebook.com/orchestrakot/"><i class="fa-brands fa-facebook"></i></a>
					<a href="https://www.instagram.com/orchestrakot/?hl=en"><i class="fa-brands fa-instagram"></i></a>
				</div>
			</div>
		</footer>
	</div>

	<!-- Video modal overlay -->
	<div id="video-modal" class="video-modal-overlay">
		<button class="video-modal-close" onclick="closeVideoModal()">
			<i class="fa fa-times"></i>
		</button>
		<div class="video-modal-inner">
			<iframe id="video-modal-iframe"
				src=""
				frameborder="0"
				allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
				allowfullscreen>
			</iframe>
		</div>
	</div>

	<script src="js/jquery-1.11.1.min.js"></script>
	<script src="js/plugins.js"></script>
	<script src="js/app.js"></script>
	<script type="module" src="src/js/videos.js"></script>
	<script type="module" src="src/js/nav.js"></script>
</body>
</html>
